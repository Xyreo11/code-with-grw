services:
  postgres:
    image: postgres:16-alpine
    container_name: sitrep-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sitrep
      POSTGRES_PASSWORD: sitrep
      POSTGRES_DB: sitrep
    # 5432 is occupied on the host, so publish on 5433
    ports:
      - "5433:5432"
    volumes:
      - sitrep_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sitrep -d sitrep"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: sitrep-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - sitrep_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

# The web app and worker run on the host (npm run dev / npm run worker) rather
# than in compose: this is a local-only project, and keeping them out of the
# image means no rebuild between edits. Compose owns the stateful services only.

volumes:
  sitrep_pgdata:
  sitrep_redisdata:
